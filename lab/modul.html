<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="icon" type="image/png" href="favicon.png" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #080c10;
    }
    body {
      --text-color: #e8dfc8;
      --container-bg: #162030;
      --border-color: rgba(160,130,60,0.18);
    }
    .modul-wrapper {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
    }
    nav.modul-nav {
      flex: 0 0 auto;
      background: rgba(8,12,16,0.96);
      border-bottom: 1px solid var(--border-color);
      height: 56px;
      padding: 0 clamp(1rem, 3vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
    }
    .modul-meta-center {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modul-icon { font-size: 20px; }
    .modul-title {
      font-family: 'Cinzel', serif;
      font-size: 15px;
      font-weight: 600;
      color: #d4aa3a;
      letter-spacing: 0.05em;
    }
    .modul-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 12px;
    }
    .modul-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border: 1px solid rgba(212,170,50,0.4);
      border-radius: 20px;
      color: #d4aa3a;
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: all 0.2s;
      background: rgba(212,170,50,0.04);
    }
    .modul-back-btn:hover {
      background: rgba(212,170,50,0.15);
      border-color: #d4aa3a;
      color: #fff;
      transform: translateY(-1px);
    }
    .modul-main-stage {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
      height: calc(100vh - 56px);
    }
    #mapControlsContainer {
      width: 320px;
      min-width: 280px;
      max-width: 380px;
      background: #0d1520;
      border-right: 1px solid rgba(160,130,60,0.2);
      padding: 1.25rem;
      overflow-y: auto;
      display: none;
      z-index: 10;
    }
    #mapCanvas {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      overflow-y: auto;
      background: #080c10;
    }
    #loadingScreen {
      position: absolute;
      inset: 0;
      background: #080c10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1500;
      gap: 16px;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(212,170,50,0.15);
      border-top-color: #d4aa3a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modul-error {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 2rem;
      gap: 12px;
    }

    @media (max-width: 768px) {
      .modul-main-stage {
        flex-direction: column;
      }
      #mapControlsContainer {
        width: 100%;
        max-width: 100%;
        border-right: none;
        border-bottom: 1px solid rgba(160,130,60,0.2);
        max-height: 220px;
      }
      .modul-title {
        font-size: 13px;
      }
    }
  </style>
</head>
<body class="modul-page">
  <div class="modul-wrapper">
    <nav class="modul-nav">
      <a href="index.html" class="nav-brand" title="lab.kirkyama.uk">
        <div class="nav-logo">L</div>
        <div class="nav-wordmark"><span>lab</span><em>.kirkyama.uk</em></div>
      </a>

      <div class="modul-meta-center">
        <span class="modul-icon" id="modulIcon">⚗️</span>
        <span class="modul-title" id="modulName">Modül Yükleniyor...</span>
        <span class="modul-badge" id="modulBadge"></span>
      </div>

      <a href="index.html" class="modul-back-btn">
        <span>←</span>
        <span>Lab Vitrini</span>
      </a>
    </nav>

    <div class="modul-main-stage">
      <div id="mapControlsContainer"></div>
      <div id="mapCanvas"></div>

      <div id="loadingScreen">
        <div class="spinner"></div>
        <p style="font-family:'Cinzel',serif; font-size:13px; letter-spacing:0.12em; color:#d4aa3a;">Modül Hazırlanıyor...</p>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/sinif9haritalar.js"></script>
  <script src="js/motor.js"></script>
</body>
</html>
